# emanuel.quickshare `quickshare fast on`: run the Wi-Fi Direct link with the station taken away
# from NetworkManager (see /usr/local/lib/omarchy-quickshare/quickshare-fastlink).
[Service]
ExecStart=
ExecStart=/usr/local/lib/omarchy-quickshare/quickshare-fastlink
# Safety net if the helper died: hand the station back to NetworkManager before upstream's
# quickshare-reconnect brings the connection up from the same marker.
ExecStopPost=
ExecStopPost=-/bin/sh -c 'for f in /run/quickshare-reconnect-*; do [ -e "$$f" ] && nmcli device set "$${f#/run/quickshare-reconnect-}" managed yes; done; true'
ExecStopPost=-/usr/lib/quickshare-direct/quickshare-reconnect
