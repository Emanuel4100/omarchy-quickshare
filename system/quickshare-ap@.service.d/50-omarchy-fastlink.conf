# emanuel.quickshare `quickshare fast on`: run the Wi-Fi Direct link next to the Wi-Fi connection,
# or with the station taken away from NetworkManager when that isn't possible
# (see /usr/local/lib/omarchy-quickshare/quickshare-fastlink).
[Service]
ExecStart=
ExecStart=/usr/local/lib/omarchy-quickshare/quickshare-fastlink
# Safety nets if the helper died: drop the D-Bus policy it holds while a group starts, and hand the
# station back to NetworkManager before upstream's quickshare-reconnect brings the connection up
# from the same marker.
ExecStopPost=
ExecStopPost=-/bin/sh -c 'f=/etc/dbus-1/system.d/zz-quickshare-hold-group.conf; if [ -e "$$f" ]; then rm -f "$$f"; busctl call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus ReloadConfig; fi; true'
ExecStopPost=-/bin/sh -c 'for f in /run/quickshare-reconnect-*; do [ -e "$$f" ] && nmcli device set "$${f#/run/quickshare-reconnect-}" managed yes; done; true'
ExecStopPost=-/usr/lib/quickshare-direct/quickshare-reconnect
